syntax = "proto3";
package moaje.events.asset;

import "common/resources.proto";

option java_package = "com.moaje.events.asset";
option java_multiple_files = true;

message AssetTransferRequestedEvent {
  string event_id = 1;
  int64 transfer_id = 2;
  int64 asset_transaction_id = 3;
  int64 user_id = 4;
  string ci = 5;
  string user_name = 6;
  string phone_number = 7;
  string withdrawal_account_id = 8;
  string deposit_bank_code = 9;
  string deposit_account_number = 10;
  moaje.common.Money amount = 11;
  string occurred_at = 12;
}

message DailyCashflowUpdatedEvent {
  string event_id = 1;
  int64 user_id = 2;
  moaje.common.Money daily_limit = 3;
  string snapshot_date = 4;
  string occurred_at = 5;
}

message TransactionSucceededEvent {
  string event_id = 1;
  int64 transaction_id = 2;
  string public_transaction_id = 3;
  int64 user_id = 4;
  int64 account_id = 5;
  string account_token = 6;
  string external_transaction_id = 7;
  string transaction_type = 8;
  moaje.common.Money amount = 9;
  string target_token = 10;
  moaje.common.Money balance_after_transaction = 11;
  string succeeded_at = 12;
  string occurred_at = 13;
}
