syntax = "proto3";
package moaje.events.asset;

import "common/resources.proto";

option java_package = "com.moaje.events.asset";
option java_multiple_files = true;

message DailyCashflowUpdatedEvent {
  string event_id = 1;
  string user_id = 2;
  moaje.common.Money daily_limit = 3;
  string snapshot_date = 4;
  string occurred_at = 5;
}

message TransactionSucceededEvent {
  string event_id = 1;
  int64 transaction_id = 2;
  string public_transaction_id = 3;
  string user_id = 4;
  int64 account_id = 5;
  string external_transaction_id = 6;
  string transaction_type = 7;
  moaje.common.Money amount = 8;
  string target_token = 9;
  moaje.common.Money balance_after_transaction = 10 [deprecated = true];
  string succeeded_at = 11;
  string occurred_at = 12;
  // Empty succeeded_at means the source did not provide a completion time (legacy data).
  string recovered_at = 13;
  string recorded_at = 14;
  string external_type = 15;
  string timestamp_source = 16;
  // Snapshot balance is NOT the balance immediately after each historical transaction.
  moaje.common.Money snapshot_balance = 17;
  string snapshot_as_of = 18;
}

message MonthlyCashflowAggregatedEvent {
  string event_id = 1;
  string user_id = 2;
  string year_month = 3;
  int64 revision = 4;
  moaje.common.Money income_amount = 5;
  moaje.common.Money expense_amount = 6;
  // 개인 간 자금 이동은 소비로 오해하지 않도록 별도 금액으로 제공한다.
  moaje.common.Money transfer_amount = 7;
  string calculated_at = 8;
}

message CategoryCashflowAmount {
  string category = 1;
  moaje.common.Money amount = 2;
}

message CategoryCashflowAggregatedEvent {
  string event_id = 1;
  string user_id = 2;
  string year_month = 3;
  int64 revision = 4;
  repeated CategoryCashflowAmount categories = 5;
  string calculated_at = 6;
}
